<!DOCTYPE html>
<html>
<body>
<script type="module">
  import * as THREE from 'https://esm.sh/three@0.150.1';
  import { OrbitControls } from 'https://esm.sh/three@0.150.1/examples/jsm/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);

  // Cord
  const cordGeo = new THREE.CylinderGeometry(0.02, 0.02, 2);
  const cordMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
  const cord = new THREE.Mesh(cordGeo, cordMat);
  cord.position.y = 2.5;
  scene.add(cord);

  // Socket
  const socketGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.4, 32);
  const socketMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
  const socket = new THREE.Mesh(socketGeo, socketMat);
  socket.position.y = 1.3;
  scene.add(socket);

  // Bulb Base (Ballast housing)
  const baseGeo = new THREE.CylinderGeometry(0.2, 0.15, 0.3, 32);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.95;
  scene.add(base);

  // Spiral Bulb
  class SpiralCurve extends THREE.Curve {
    getPoint(t, optionalTarget = new THREE.Vector3()) {
      // t goes from 0 to 1
      const turns = 3;
      const radius = 0.12;
      const height = 0.6;
      const y = -height * t + 0.8;
      const angle = t * Math.PI * 2 * turns;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      return optionalTarget.set(x, y, z);
    }
  }

  // To make it look like a real CFL, usually there are two spirals or U-tubes.
  // Let's do a spiral going down and coming back up.
  class CFLCurve extends THREE.Curve {
    getPoint(t, optionalTarget = new THREE.Vector3()) {
      const turns = 4;
      const maxRadius = 0.15;
      let y, angle, r;
      if (t < 0.5) {
        // Going down
        const t2 = t * 2;
        y = 0.8 - t2 * 0.7;
        angle = t2 * Math.PI * 2 * turns;
        r = maxRadius;
        return optionalTarget.set(Math.cos(angle)*r, y, Math.sin(angle)*r);
      } else {
        // Coming up (straight or slight spiral inside)
        const t2 = (t - 0.5) * 2;
        y = 0.1 + t2 * 0.7;
        r = 0.05; // inner return path
        angle = t2 * Math.PI * 2 * turns;
        return optionalTarget.set(0, y, 0); // straight up the middle
      }
    }
  }

  // A better CFL curve: 4 U-tubes
  const bulbGroup = new THREE.Group();
  const tubeMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    emissive: 0xffffee,
    emissiveIntensity: 1, // Will modulate
    transparent: true,
    opacity: 0.9,
    roughness: 0.1,
    transmission: 0.9,
    thickness: 0.1
  });

  for(let i=0; i<4; i++) {
    const angleOffset = (i / 4) * Math.PI * 2;
    class UTube extends THREE.Curve {
        getPoint(t, optionalTarget = new THREE.Vector3()) {
            // t from 0 to 1
            const rBase = 0.12;
            const h = 0.7;
            const x = Math.cos(angleOffset) * rBase;
            const z = Math.sin(angleOffset) * rBase;
            
            if (t < 0.45) {
                // down
                return optionalTarget.set(x, 0.8 - (t/0.45)*h, z);
            } else if (t > 0.55) {
                // up (shifted slightly)
                const x2 = Math.cos(angleOffset + Math.PI/4) * rBase;
                const z2 = Math.sin(angleOffset + Math.PI/4) * rBase;
                return optionalTarget.set(x2, 0.8 - ((1-t)/0.45)*h, z2);
            } else {
                // curve at bottom
                const tt = (t - 0.45) / 0.1; // 0 to 1
                const ang = Math.PI - tt * Math.PI; // PI to 0
                const midX = (x + Math.cos(angleOffset + Math.PI/4) * rBase) / 2;
                const midZ = (z + Math.sin(angleOffset + Math.PI/4) * rBase) / 2;
                const rad = Math.sqrt(Math.pow(x - midX, 2) + Math.pow(z - midZ, 2));
                
                // this is getting complex, let's just stick to a simple spiral
                return optionalTarget.set(x, 0.8 - h, z);
            }
        }
    }
  }

  const simpleSpiral = new THREE.TubeGeometry(new CFLCurve(), 200, 0.03, 16, false);
  const spiralMesh = new THREE.Mesh(simpleSpiral, tubeMat);
  bulbGroup.add(spiralMesh);
  
  scene.add(bulbGroup);

  const ambient = new THREE.AmbientLight(0x404040);
  scene.add(ambient);

  const pointLight = new THREE.PointLight(0xffffee, 2, 10);
  pointLight.position.set(0, 0.4, 0);
  scene.add(pointLight);

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
