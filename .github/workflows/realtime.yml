name: Realtime checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:realtime
      - run: npx tsx server/realtime/productionGate.test.ts
      - run: npm run build
