# Kamailio Configuration for Barghchee Native VoIP
# مسیر فایل: config/kamailio/barghchee.cfg

#!KAMAILIO

debug=2
log_facility=LOG_LOCAL0
fork=yes
log_stderror=no

listen=udp:10.0.0.10:5060   # IP داخلی سرور شما
listen=tcp:10.0.0.10:5060
listen=ws:10.0.0.10:5070    # WebSocket برای کلاینت‌های تحت وب

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"
loadmodule "rtimer.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "siputils.so"
loadmodule "textops.so"
loadmodule "pv.so"
loadmodule "htable.so"

# تنظیمات ثبت نام (Registration)
modparam("usrloc", "db_mode", 2)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)

# تنظیمات WebSocket
modparam("websocket", "allowed_origins", "*")
modparam("websocket", "connection_timeout", 30)

route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    t_relay();
                } else {
                    sl_send_reply("404","No Transaction Found");
                }
                exit;
            }
            t_relay();
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) { t_relay(); exit; }
            sl_send_reply("404","No Transaction Found");
            exit;
        }
        t_relay();
        exit;
    }

    if (is_method("REGISTER")) {
        if (!save("location")) {
            sl_reply_error();
            exit;
        }
        exit;
    }

    if (!lookup("location")) {
        t_reply("404", "Not Found");
        exit;
    }

    if (nat_uac_test("19")) {
        if (is_method("INVITE")) {
            fix_nated_contact();
            fix_nated_sdp();
        } else {
            fix_nated_contact();
        }
    }

    route(1);
}

route[1] {
    t_on_branch("1");
    t_on_reply("1");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

branch_route[1] {
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE|PUBLISH|MESSAGE")) {
        if (!add_rr(";lr")) {
            sl_reply_error();
            exit;
        }
    }
}

onreply_route[1] {
    if (is_method("INVITE") && t_is_canceled()) {
        exit;
    }
    if (nat_uac_test("19")) {
        if (is_method("200")) {
            fix_nated_contact();
            fix_nated_sdp();
        }
    }
}